
name: Build VIPTIERS Plugin

on:
  push:
    paths:
      - 'minecraft-server/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build plugin
        run: mvn -B package
        working-directory: minecraft-server

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: VIPTIERS-Plugin
          path: minecraft-server/target/*.jar
