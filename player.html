
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIPTIERS | Player Profile</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 30px 16px;
            background: #090912;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 950px;
            margin: 40px auto;
        }

        .profile {
            padding: 30px;
            background: #151522;
            border: 1px solid #49376b;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 0 30px #8855d922;
        }

        .skin {
            width: 120px;
            height: 120px;
            object-fit: contain;
            image-rendering: pixelated;
            margin-bottom: 10px;
        }

        h1 { color: #b58aff; }

        .uuid, .muted { color: #999; }

        .status {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            background: #29253c;
            color: #b58aff;
        }

        .verified {
            background: #123522;
            color: #55e88a;
        }

        .tiers {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 14px;
            margin-top: 25px;
        }

        .tier {
            padding: 20px;
            background: #151522;
            border: 1px solid #29253c;
            border-radius: 12px;
            text-align: center;
        }

        .tier h3 {
            color: #b58aff;
            margin-top: 0;
        }

        .tier p {
            color: #aaa;
            margin-bottom: 0;
        }

        .tested { color: #55e88a !important; }
        .not-tested { color: #999 !important; }

        .tier-value {
            display: block;
            color: #ffd700;
            font-size: 23px;
            font-weight: bold;
            margin: 12px 0;
        }

        a { color: #b58aff; }

        @media (max-width: 500px) {
            .profile { padding: 22px 14px; }
            .container { margin: 15px auto; }
        }
    </style>
</head>

<body>
    <main class="container">

        <section class="profile">
            <img
                id="skin"
                class="skin"
                src="https://mc-heads.net/avatar/Steve/120"
                alt="Minecraft player skin"
            >

            <h1 id="username">Loading Player...</h1>

            <p class="uuid" id="uuid">Loading UUID...</p>

            <p class="status" id="verification">
                Checking verification...
            </p>

            <p class="muted" id="verifiedDate"></p>
            <p class="muted" id="status">Loading profile...</p>
        </section>

        <h2>Gamemode Tiers</h2>

        <section class="tiers" id="tiers">
        </section>

        <p style="text-align:center;margin-top:35px">
            <a href="index.html">Back to VIPTIERS</a>
        </p>

    </main>

    <script>
        const API_URL = "https://viptiers.onrender.com";

        const GAMEMODES = [
            "Crystal",
            "UHC",
            "Pot",
            "NethOP",
            "DiaSMP",
            "Sword",
            "Axe",
            "Mace",
            "Spear Mace",
            "Cart"
        ];

        const params = new URLSearchParams(window.location.search);
        const requestedPlayer = params.get("username");

        const usernameElement = document.getElementById("username");
        const uuidElement = document.getElementById("uuid");
        const verificationElement = document.getElementById("verification");
        const dateElement = document.getElementById("verifiedDate");
        const statusElement = document.getElementById("status");
        const skinElement = document.getElementById("skin");
        const tiersElement = document.getElementById("tiers");

        function displayTiers(gamemodes) {
            tiersElement.replaceChildren();

            GAMEMODES.forEach(mode => {
                const result = gamemodes?.[mode] || {};
                const tested = result.tested === true;
                const tier = result.tier || "Not ranked";

                const card = document.createElement("div");
                card.className = "tier";

                const heading = document.createElement("h3");
                heading.textContent = mode;

                const tierValue = document.createElement("span");
                tierValue.className = "tier-value";
                tierValue.textContent = tested ? tier : "—";

                const testStatus = document.createElement("p");
                testStatus.className = tested ? "tested" : "not-tested";
                testStatus.textContent = tested ? "Tested" : "Not tested";

                card.append(heading, tierValue, testStatus);
                tiersElement.appendChild(card);
            });
        }

        async function loadProfile() {
            if (!requestedPlayer) {
                usernameElement.textContent = "Player not found";
                statusElement.textContent =
                    "No Minecraft username was provided.";
                displayTiers({});
                return;
            }

            usernameElement.textContent = requestedPlayer;
            statusElement.textContent = "Loading player profile...";

            try {
                const response = await fetch(
                    `${API_URL}/api/verification/player/${encodeURIComponent(requestedPlayer)}`,
                    { cache: "no-store" }
                );

                const data = await response.json();

                if (!response.ok || !data.success || !data.player) {
                    throw new Error(
                        data.error || "Verified player not found."
                    );
                }

                const profile = data.player;

                if (!profile.uuid || !profile.username) {
                    throw new Error("Player data is incomplete.");
                }

                usernameElement.textContent = profile.username;
                uuidElement.textContent = "UUID: " + profile.uuid;

                verificationElement.textContent = "✓ Verified";
                verificationElement.classList.add("verified");

                if (profile.verifiedAt) {
                    dateElement.textContent =
                        "Verified on: " +
                        new Date(profile.verifiedAt).toLocaleString();
                }

                // Minecraft skin and head
                skinElement.src =
                    `https://mc-heads.net/avatar/${encodeURIComponent(profile.uuid)}/120`;

                skinElement.onerror = () => {
                    skinElement.src =
                        "https://mc-heads.net/avatar/Steve/120";
                };

                displayTiers(profile.gamemodes || {});

                statusElement.textContent =
                    "Welcome to VIPTIERS!";

            } catch (error) {
                verificationElement.textContent = "Not verified";
                verificationElement.classList.remove("verified");

                uuidElement.textContent = "";
                dateElement.textContent = "";

                skinElement.src =
                    "https://mc-heads.net/avatar/Steve/120";

                statusElement.textContent = error.message;

                displayTiers({});
            }
        }

        loadProfile();
    </script>
</body>
</html>
