
name: VIPTIERS
version: 1.3.0
main: net.viptiers.server.VIPTIERS
api-version: '1.21'

commands:
  verify:
    description: Verify your Minecraft account
    usage: /verify <code>

  verified:
    description: List verified players
    permission: viptiers.admin

  unverify:
    description: Remove a player's verification
    permission: viptiers.admin

permissions:
  viptiers.admin:
    description: Allows verification administration
    default: op
