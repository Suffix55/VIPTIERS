
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIPTIERS | Verify Account</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #090912;
            color: white;
            font-family: Arial, sans-serif;
        }

        .panel {
            width: min(440px, 92%);
            padding: 38px 30px;
            text-align: center;
            background: #151522;
            border: 1px solid #49376b;
            border-radius: 16px;
        }

        h1 { color: #b58aff; }

        p {
            color: #aaa;
            line-height: 1.6;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background: #8855d9;
            color: white;
            border: 0;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        a { color: #b58aff; }
    </style>
</head>
<body>
    <main class="panel">
        <h1>VIPTIERS</h1>
        <h2>Minecraft Account Verification</h2>

        <p>
            Verify ownership of your Minecraft account
            to create your VIPTIERS player profile.
        </p>

        <p>
            You'll be redirected to Microsoft's official
            sign-in page. VIPTIERS will never ask for
            your Microsoft password directly.
        </p>

        <button disabled>
            Microsoft Verification — Coming Soon
        </button>

        <p>
            <a href="index.html">Back to VIPTIERS</a>
        </p>
    </main>
</body>
</html>
